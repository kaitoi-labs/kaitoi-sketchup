<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaitoi Agent</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="agent.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Kaitoi Agent <span id="version" class="muted"></span></div>
    <div class="topbar-right">
      <button id="connect" class="ghost small" hidden>Connect</button>
      <button id="signout" class="ghost small" hidden>Sign out</button>
      <div id="conn" class="pill pill-warn">not connected</div>
    </div>
  </header>

  <main class="agent-grid">
    <section class="chat-col">
      <div class="col-head">
        <span>Chat</span>
        <button id="reset" class="ghost small">New session</button>
      </div>

      <div id="transcript" class="transcript" role="log" aria-live="polite"></div>

      <div id="agent-status" class="status"></div>

      <div class="composer">
        <textarea id="input" rows="2" placeholder="Ask Kaitoi to make something from the current view…"></textarea>
        <div class="composer-actions">
          <label class="check">
            <input type="checkbox" id="use-capture" checked>
            use capture
          </label>
          <label class="check" id="use-last-wrap" title="Continue from the last generated image or video">
            <input type="checkbox" id="use-last" disabled>
            use last asset
          </label>
          <button id="capture" class="ghost">Capture view</button>
          <button id="send" class="primary">Send</button>
        </div>
      </div>
    </section>

    <section class="media-col">
      <figure>
        <figcaption>Capture <span id="attached" class="muted"></span></figcaption>
        <div id="capture-slot" class="slot empty">no capture yet</div>
      </figure>
      <figure>
        <figcaption>
          Result
          <button id="open-folder" class="ghost small">Open folder</button>
        </figcaption>
        <div id="result-slot" class="slot empty">no result yet</div>
      </figure>
    </section>
  </main>

  <script src="agent.js"></script>
</body>
</html>
